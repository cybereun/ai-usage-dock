<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>AI 사용량 — 설정</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#f5f7fb;color:#1f2430;font-family:'Segoe UI','Malgun Gothic',sans-serif;padding:28px 32px 40px;min-height:100vh}
h1{font-size:21px;margin-bottom:4px}p.sub{color:#8a93a8;font-size:13px;margin-bottom:20px}
h2{font-size:12px;color:#9aa2b5;letter-spacing:.5px;margin:26px 0 10px;font-weight:600}
.box{background:#fff;border:1px solid #e6e9f0;border-radius:14px;padding:14px 16px}
.acc{--c:#3b82f6;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.badge{font-weight:700;min-width:92px}.badge::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
input,select{background:#f7f9fc;border:1px solid #e1e6f0;color:#1f2430;border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;outline:0}
input:focus,select:focus{border-color:#3b82f6;background:#fff}
input.n{width:64px}input.w{flex:1;min-width:160px}
button{background:#eef1f7;color:#3b4560;border:0;border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
button:hover{background:#e1e6f0}button.g{background:transparent;color:#7b849a}button.g:hover{background:#eef1f7}button.d{background:transparent;color:#d9534f}button.d:hover{background:#fdecec}
button.p{background:#3b82f6;color:#fff}button.p:hover{background:#2f6fdb}
.msg{font-size:12px;color:#9aa2b5}.msg.bad{color:#b7791f}.msg.ok{color:#16a34a}
label.ck{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.hint{font-size:12px;color:#9aa2b5;margin-top:8px;line-height:1.6}
</style></head><body>
<h1>AI 사용량 설정</h1><p class="sub">같은 AI라도 계정을 여러 개 추가할 수 있어요. 계정마다 로그인이 따로 저장됩니다.</p>
<h2>계정</h2><div id="list"></div>
<div class="box"><div class="row"><b>＋ 계정 추가</b>
<select id="ns"></select><input id="nl" class="w" placeholder="별명 (예: 개인, 회사, 계정2)"><button class="p" id="add">추가</button></div>
<div class="hint">Claude · Codex 는 <b>자동 읽기</b>(로그인 필요), Gemini · Antigravity · Grok 등은 처음엔 <b>수동 입력</b>이에요. 사용량 화면 주소를 알면 방식을 "자동"으로 바꾸고 주소를 넣어 보세요.</div></div>
<h2>표시 방식</h2><div class="box">
<label class="ck"><input type="checkbox" id="tt"> 화면 맨 위 가운데에 마우스를 대면 나타나기</label>
<label class="ck"><input type="checkbox" id="ct"> 작업표시줄 시계(오른쪽 아래)에 마우스를 대면 나타나기</label>
<label class="ck"><input type="checkbox" id="as"> 윈도우 시작 시 자동 실행</label>
<div class="row">자동 갱신 주기 <input id="iv" class="n" type="number" min="1" max="60"> 분 <span class="msg">· 단축키 <b>Ctrl+Alt+U</b> 로 바로 보기 · 트레이 아이콘 클릭도 가능</span></div></div>
<script>
let S={accounts:[],services:{},settings:{}},sig='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function build(){
  $('ns').innerHTML=Object.entries(S.services).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
  $('list').innerHTML=S.accounts.map(a=>{const v=S.services[a.service]||{name:a.service,color:'#60a5fa'};return `<div class="box acc" style="--c:${v.color}" data-id="${a.id}">
<div class="row"><span class="badge">${v.name}</span><input class="w" data-k="label" value="${esc(a.label)}" placeholder="별명">
<select data-k="mode"><option value="auto"${a.mode==='auto'?' selected':''}>자동 읽기</option><option value="manual"${a.mode==='manual'?' selected':''}>수동 입력</option>${a.service==='antigravity'?`<option value="cli"${a.mode==='cli'?' selected':''}>CLI 읽기 (agy)</option>`:''}</select>
<button class="g" data-a="up">▲</button><button class="g" data-a="dn">▼</button><button class="d" data-a="rm">삭제</button></div>
${a.mode==='cli'?`<div class="row"><select data-k="group"><option value="Gemini Models"${a.group!=='Claude and GPT models'?' selected':''}>Gemini 모델</option><option value="Claude and GPT models"${a.group==='Claude and GPT models'?' selected':''}>Claude·GPT 모델</option></select><button class="g" data-a="rf">지금 읽기</button><span class="msg">agy CLI 의 /usage 로 자동 읽기</span></div>`:a.mode==='auto'?`<div class="row"><input class="w" data-k="url" value="${esc(a.url)}" placeholder="사용량 화면 주소"><button data-a="login">로그인</button><button class="g" data-a="rf">지금 읽기</button></div>`
:`<div class="row">5시간 <input class="n" type="number" min="0" max="100" data-k="h5" value="${a.h5.pct}">% <input class="w" data-k="h5r" value="${esc(a.h5.reset)}" placeholder="초기화 시각 (선택)">
주간 <input class="n" type="number" min="0" max="100" data-k="wk" value="${a.wk.pct}">% <input class="w" data-k="wkr" value="${esc(a.wk.reset)}" placeholder="초기화 시각 (선택)"></div>`}
<div class="msg" data-st></div></div>`}).join('')||'<div class="box msg">아직 계정이 없어요. 아래에서 추가하세요.</div>';
}
function status(){document.querySelectorAll('.acc').forEach(el=>{const a=S.accounts.find(x=>x.id===el.dataset.id);if(!a)return;const m=el.querySelector('[data-st]');
 m.className='msg '+(a.status==='ok'?'ok':a.status==='login'||a.status==='error'?'bad':'');
 m.textContent=a.loading?'읽는 중…':a.status==='ok'?`읽기 성공 · 5시간 ${a.h5.pct}% · 주간 ${a.wk.pct}%`:a.status==='login'?'로그인이 필요해요 → [로그인] 후 창을 닫으면 자동으로 읽어요':a.status==='error'?a.msg:a.status==='manual'?'수동 입력 값을 사용 중':''})}
function sync(s){S=s;if(!$('ns').options.length)$('ns').innerHTML=Object.entries(S.services).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');const n=S.accounts.map(a=>a.id+a.mode+a.service).join();if(n!==sig){sig=n;build()}status();
 $('tt').checked=S.settings.topTrigger;$('ct').checked=S.settings.clockTrigger;$('as').checked=S.settings.autoStart;if(document.activeElement!==$('iv'))$('iv').value=S.settings.intervalMin}
api.getState().then(sync);api.onState(sync);
$('add').onclick=()=>{api.add({service:$('ns').value,label:$('nl').value.trim()});$('nl').value=''};
$('list').onchange=e=>{const el=e.target,id=el.closest('.acc').dataset.id,k=el.dataset.k,a=S.accounts.find(x=>x.id===id);if(!k)return;
 if(k==='mode'||k==='label'||k==='url'||k==='group')api.update(id,{[k]:el.value});
 else{const p=n=>Math.max(0,Math.min(100,+n||0));const patch={h5:{...a.h5},wk:{...a.wk}};
  if(k==='h5')patch.h5.pct=p(el.value);if(k==='h5r')patch.h5.reset=el.value;if(k==='wk')patch.wk.pct=p(el.value);if(k==='wkr')patch.wk.reset=el.value;api.update(id,patch)}};
$('list').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.closest('.acc').dataset.id;({login:()=>api.login(id),rf:()=>api.refresh(id),up:()=>api.move(id,-1),dn:()=>api.move(id,1),rm:()=>confirm('이 계정을 삭제할까요?')&&api.remove(id)})[b.dataset.a]()};
$('tt').onchange=()=>api.setSettings({topTrigger:$('tt').checked});$('ct').onchange=()=>api.setSettings({clockTrigger:$('ct').checked});
$('as').onchange=()=>api.setSettings({autoStart:$('as').checked});$('iv').onchange=()=>api.setSettings({intervalMin:Math.max(1,+$('iv').value||3)});
</script></body></html>
